<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信订单助手</title><style>body{font-family:-apple-system,Arial;background:#f5f6fa;color:#222;max-width:700px;margin:auto;padding:18px}h2{margin:8px 0}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin:6px 0}textarea{height:140px}button{background:#1769e0;color:white;border:0;border-radius:9px;padding:13px 16px;font-size:16px;margin:5px 5px 5px 0}.secondary{background:#555}.danger{background:#c33}.card{background:white;border-radius:12px;padding:15px;margin:12px 0}small{color:#666}.order{border-bottom:1px solid #ddd;padding:10px 0;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><h2>📦 微信订单助手</h2><small>复制微信订单，粘贴识别。数据保存在本机浏览器，请定期导出备份。</small><div class="card"><label>微信订单原文</label><textarea id="raw" placeholder="例如：1单：蓝莓 5盒55000包邮\n서울 구로구...\n01040700833 王女士"></textarea><label>订单来源（群名，可不填）</label><input id="source" placeholder="例如：水果客户群"><button onclick="parse()">识别订单</button><div id="preview" style="display:none"><div class="row"><div>商品<input id="product"></div><div>数量<input id="qty"></div><div>金额（韩元）<input id="amount" inputmode="numeric"></div><div>电话<input id="phone"></div></div>姓名<input id="name" placeholder="姓名">地址<textarea id="address" style="height:65px"></textarea><button onclick="save()">确认保存</button></div></div><div class="card"><b id="summary">订单 0 单 · 合计 ₩0</b><div><button class="secondary" onclick="exportCSV()">导出Excel可打开的CSV</button><button class="danger" onclick="clearAll()">清空记录</button></div><div id="orders"></div></div><script>
const $=id=>document.getElementById(id), key='wechat_orders_v1';let orders=[];try{orders=JSON.parse(localStorage.getItem(key)||'[]')}catch{};function parse(){let s=$('raw').value.trim();if(!s)return alert('请先粘贴订单');let phone=s.match(/01[016789][\s-]?\d{3,4}[\s-]?\d{4}/),money=s.match(/(?:合计|总价|金额|价格|₩)\s*[:：]?\s*([\d,]+)/),combo=[...s.matchAll(/(\d+)\s*(盒|箱|个|包|袋|件|斤|kg|公斤)\s*([\d,]{4,})/gi)];let line=s.split(/\n/).find(x=>/蓝莓|榴莲|水果|苹果|橘子|草莓|芒果|红参|虾|鸡|猕猴桃/.test(x))||s.split(/\n/)[0];$('product').value=line.replace(/^\s*\d+\s*单\s*[:：]/,'').replace(/\d+\s*(盒|箱|个|包|袋|件)\s*[\d,]{4,}.*/, '').trim();$('qty').value=combo.length?combo[0][1]+combo[0][2]:'';$('amount').value=money?money[1].replace(/,/g,''):combo.length?combo[0][3].replace(/,/g,''):'';$('phone').value=phone?phone[0].replace(/[\s-]/g,''):'';let lines=s.split(/\n/).map(x=>x.trim()).filter(Boolean);$('address').value=lines.filter(x=>/[가-힣]/.test(x)&&(/\d/.test(x)||/시|구|동|로|길/.test(x))).join(' ');$('name').value='';$('preview').style.display='block';}function save(){let raw=$('raw').value.trim();if(orders.some(o=>o.raw===raw&&!confirm('发现相同原文订单，仍要保存吗？')))return;orders.unshift({date:new Date().toLocaleString('zh-CN'),raw,source:$('source').value,product:$('product').value,qty:$('qty').value,amount:Number($('amount').value)||0,phone:$('phone').value,name:$('name').value,address:$('address').value});persist();$('raw').value='';$('preview').style.display='none';alert('订单已保存在当前浏览器');}function persist(){localStorage.setItem(key,JSON.stringify(orders));render()}function render(){$('summary').textContent=`订单 ${orders.length} 单 · 合计 ₩${orders.reduce((a,o)=>a+o.amount,0).toLocaleString()}`;$('orders').replaceChildren();orders.forEach((o,i)=>{let d=document.createElement('div');d.className='order';d.textContent=`${i+1}. ${o.date} [${o.source||'未填来源'}]\n${o.product} ${o.qty} · ₩${o.amount.toLocaleString()}\n${o.name} ${o.phone}\n${o.address}`;$('orders').append(d)})}function exportCSV(){let rows=[['时间','来源','商品','数量','金额韩元','姓名','电话','地址','订单原文'],...orders.map(o=>[o.date,o.source,o.product,o.qty,o.amount,o.name,o.phone,o.address,o.raw])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='微信订单_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function clearAll(){if(confirm('确认删除全部本机订单？请先导出备份。')){orders=[];persist()}}render();</script></html>
